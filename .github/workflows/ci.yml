name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker-smoke:
    needs: [backend, frontend]
    # 22.04 pinned: Playwright 1.40's --with-deps still installs libasound2, renamed libasound2t64 on 24.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose up -d --build

      - name: Wait for api healthcheck
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || echo "starting")
            echo "api health: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "api did not become healthy in time"
          exit 1

      - run: pip install httpx openpyxl

      - run: python scripts/smoke_test.py

      - run: python scripts/resume_test.py

      - name: Install frontend deps for e2e
        if: hashFiles('frontend/e2e/**') != ''
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: hashFiles('frontend/e2e/**') != ''
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        if: hashFiles('frontend/e2e/**') != ''
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure() && hashFiles('frontend/e2e/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Docker compose logs
        if: failure()
        run: docker compose logs

      - name: Docker compose down
        if: always()
        run: docker compose down -v
