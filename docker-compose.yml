services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      JOB_TIMEOUT_MIN: ${JOB_TIMEOUT_MIN:-30}
      RESUME_SCAN_SECONDS: ${RESUME_SCAN_SECONDS:-120}
      XLSX_READER: ${XLSX_READER:-calamine}
    volumes:
      - ./backend:/app
      - ${DATA_DIR:-./data}:/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m app.workers.run
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      RQ_WORKERS: ${RQ_WORKERS:-4}
      JOB_TIMEOUT_MIN: ${JOB_TIMEOUT_MIN:-30}
      XLSX_READER: ${XLSX_READER:-calamine}
    volumes:
      - ./backend:/app
      - ${DATA_DIR:-./data}:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    # Self-contained image: the multi-stage Dockerfile builds the bundle
    # inside Docker, so this works on a machine with only Docker installed.
    # For the bind-mounted fast-refresh dev workflow, layer
    # docker-compose.dev.yml on top (see AGENTS.md restart matrix).
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
